<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PapiCore — Painel do Desenvolvedor</title>
  <link rel="icon" href="/assets/favicon.png"><link rel="stylesheet" href="/css/desenvolvedor.css">
</head>
<body>
  <main id="loginView" class="login-shell">
    <form id="loginForm" class="login-card">
      <img src="/assets/logo.png" alt="" class="logo"><p class="eyebrow">Administração da plataforma</p>
      <h1>Painel do Desenvolvedor</h1><p class="muted">Acesso exclusivo e protegido.</p>
      <label>E-mail<input id="email" name="email" type="email" autocomplete="username" required></label>
      <label>Senha<span class="password"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" id="showPassword" aria-label="Mostrar senha">Mostrar</button></span></label>
      <p id="loginError" class="error" role="alert"></p><button class="primary" type="submit">Entrar</button>
    </form>
  </main>
  <div id="appView" class="app hidden">
    <aside id="sidebar"><div class="brand">PapiCore <small>Developer</small></div><nav id="nav"></nav><button id="logout" class="nav-button">↪ Sair</button></aside>
    <div class="workspace"><header><button id="menu" class="icon-button" aria-label="Abrir menu">☰</button><div><h1 id="pageTitle">Dashboard</h1><span id="environment" class="badge"></span></div><div class="header-actions"><span id="developerName"></span><button id="refresh">Atualizar</button></div></header><main id="content" tabindex="-1"></main></div>
  </div>
  <dialog id="modal"><div class="modal-card"><button type="button" class="close" id="modalClose" aria-label="Fechar">×</button><div id="modalBody"></div></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/js/desenvolvedor.js" defer></script>
</body></html>
