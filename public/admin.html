<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e1015" />
  <title>Painel Administrativo — Torque Detail</title>
  <link rel="icon" href="/assets/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="admin-body">

  <div id="loginView" class="login-wrap hidden">
    <div class="login-card">
      <div class="brand">
        <img src="/assets/logo-icon.png" alt="Torque Detail" class="brand-logo" />
        <span class="brand-name">Torque Detail</span>
      </div>
      <h1>Painel administrativo</h1>
      <p class="sub">Acesse com suas credenciais</p>
      <div id="loginMsg" class="login-msg hidden"></div>
      <form id="loginForm" novalidate>
        <div class="field" style="margin-bottom:14px;">
          <label for="loginEmail">E-mail</label>
          <input id="loginEmail" type="email" autocomplete="username" placeholder="admin@sistema.com" />
        </div>
        <div class="field" style="margin-bottom:22px;">
          <label for="loginPassword">Senha</label>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block">Entrar</button>
      </form>
      <div style="text-align:center;margin-top:16px;">
        <a href="/" class="btn btn-ghost btn-sm">← Voltar ao site</a>
      </div>
    </div>
  </div>

  <div id="panelView" class="hidden">
    <div class="admin-topbar">
      <button id="btnMenu" class="hamburger" aria-label="Menu">☰</button>
      <strong id="topbarTitle">Dashboard</strong>
    </div>
    <div class="admin-layout">
      <aside id="sidebar" class="admin-sidebar">
        <div class="brand">
          <img src="/assets/logo-icon.png" alt="Torque Detail" class="brand-logo" />
          <span class="brand-name">Torque Detail</span>
        </div>
        <nav class="admin-nav">
          <button data-view="dashboard">Dashboard</button>
          <button data-view="agenda">Agenda</button>
          <button data-view="appointments">Agendamentos</button>
          <button data-view="services">Serviços e valores</button>
          <button data-view="units">Unidades</button>
          <button data-view="blocks">Bloqueios</button>
          <button data-view="modalities">Formas de atendimento</button>
          <button data-view="settings">Configurações</button>
          <button id="btnLogout" style="color:var(--red);">Sair</button>
        </nav>
      </aside>

      <main class="admin-main">
        <div id="view-dashboard" class="view"></div>
        <div id="view-agenda" class="view hidden"></div>
        <div id="view-appointments" class="view hidden"></div>
        <div id="view-services" class="view hidden"></div>
        <div id="view-units" class="view hidden"></div>
        <div id="view-blocks" class="view hidden"></div>
        <div id="view-modalities" class="view hidden"></div>
        <div id="view-settings" class="view hidden"></div>
      </main>
    </div>
  </div>

  <div id="modalOverlay" class="modal-overlay"></div>
  <div id="loader" class="loader-overlay hidden"><div class="spinner"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script src="/admin.js"></script>
</body>
</html>
